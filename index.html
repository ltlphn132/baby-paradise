<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宝宝乐园">
<meta name="theme-color" content="#fff6e9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<title>宝宝乐园 · 拼音数学英语古诗</title>
<style>
  :root{
    --bg1:#fff6e9; --bg2:#eafaff;
    --c-pinyin:#ff7a59; --c-math:#37b6ff; --c-english:#8a6bff; --c-word:#33c88a; --c-poem:#ff9f43; --c-game:#12b5cb;
    --ink:#3a3a55; --card:#ffffff;
    --shadow:0 8px 0 rgba(0,0,0,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100%;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
    overscroll-behavior:none;
    overflow-x:hidden;
    padding-bottom:20px;
  }
  /* ---------- 顶栏 ---------- */
  header{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(8px);
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  header .logo{font-size:26px;font-weight:800;letter-spacing:1px;flex:1;}
  header .logo small{font-size:13px;font-weight:600;opacity:.55;margin-left:6px;}
  .iconbtn{
    border:none;background:#fff;width:52px;height:52px;border-radius:16px;
    font-size:26px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s;
  }
  .iconbtn:active{transform:translateY(3px);box-shadow:none;}

  /* ---------- 首页 ---------- */
  .wrap{max-width:960px;margin:0 auto;padding:16px;}
  .greet{text-align:center;font-size:22px;font-weight:800;margin:6px 0 18px;}
  .greet .face{font-size:44px;display:block;animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(min-width:720px){.home-grid{grid-template-columns:repeat(2,1fr);gap:22px;}}
  .big{
    position:relative;border:none;border-radius:26px;padding:26px 14px;color:#fff;
    font-size:30px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:transform .1s;min-height:150px;justify-content:center;
  }
  .big:active{transform:translateY(4px) scale(.99);box-shadow:none;}
  .big .em{font-size:64px;line-height:1;}
  .big .sub{font-size:16px;font-weight:600;opacity:.9;}
  .big.pinyin{background:linear-gradient(160deg,#ff9a76,var(--c-pinyin));}
  .big.math{background:linear-gradient(160deg,#66ccff,var(--c-math));}
  .big.english{background:linear-gradient(160deg,#a893ff,var(--c-english));}
  .big.word{background:linear-gradient(160deg,#5fe0a6,var(--c-word));}
  .big.poem{background:linear-gradient(160deg,#ffd166,var(--c-poem));}
  .big.game{background:linear-gradient(160deg,#5ad1e6,var(--c-game));}
  .big.wide{grid-column:span 2;}
  .big.off{display:none;}

  /* ---------- 子分区标签 ---------- */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{
    border:none;background:#fff;color:var(--ink);font-weight:800;font-size:18px;
    padding:12px 18px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s;
  }
  .tab:active{transform:translateY(3px);box-shadow:none;}
  .tab.on{color:#fff;}
  .tab.on.pinyin{background:var(--c-pinyin);}
  .tab.on.math{background:var(--c-math);}
  .tab.on.english{background:var(--c-english);}
  .tab.on.word{background:var(--c-word);}
  .tab.on.poem{background:var(--c-poem);}
  .tab.on.game{background:var(--c-game);}

  /* ---------- 卡片网格 ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:780px){.grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(5,1fr);}}
  .grid.poemgrid{grid-template-columns:repeat(2,1fr)!important;}

  .card{
    position:relative;background:var(--card);border-radius:22px;padding:12px 8px 14px;
    text-align:center;box-shadow:var(--shadow);cursor:pointer;min-height:120px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    transition:transform .1s;overflow:hidden;border:4px solid transparent;
  }
  .card:active{transform:translateY(4px) scale(.98);box-shadow:none;}
  .card.wide{grid-column:span 2;}
  .card .big-txt{font-size:46px;font-weight:900;line-height:1;}
  .card .emoji{font-size:56px;line-height:1;}
  .card .tag{font-size:22px;font-weight:900;}
  .card .hint{font-size:15px;font-weight:700;opacity:.6;}
  .card .say{font-size:22px;font-weight:900;color:#fff;background:#ffb020;padding:2px 12px;border-radius:999px;}
  .card.plain .big-txt{color:var(--c-pinyin);}
  .card .speak-ico{position:absolute;top:8px;right:10px;font-size:18px;opacity:.35;}
  .shape{width:74px;height:74px;}

  /* 数学点阵 */
  .dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:120px;}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--c-math);}

  /* 翻卡 */
  .flip{perspective:1000px;background:transparent;border:none;box-shadow:none;padding:0;min-height:150px;}
  .flip .inner{position:relative;width:100%;height:150px;transition:transform .5s;transform-style:preserve-3d;}
  .flip.flipped .inner{transform:rotateY(180deg);}
  .flip .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:#fff;
    box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;}
  .flip .back{transform:rotateY(180deg);}

  /* 数字大格 */
  .bignum .big-txt{font-size:78px;}
  .bignum .dots{max-width:150px;}

  /* 古诗卡 */
  .poemcard{align-items:stretch;gap:2px;padding:12px 12px 14px;}
  .poemtitle{font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0;}
  .poemtitle .au{font-size:13px;font-weight:700;opacity:.5;}
  .poemcard .line{font-size:19px;font-weight:800;padding:5px 6px;border-radius:10px;}
  .poemcard .line:active{background:#fff3e2;}

  /* 游戏乐园 */
  .gamebar,.findgrid,.crowd,.chint,.bubarea,.sgrid,.scalewrap{grid-column:1/-1}
  .gamebar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow)}
  .gamebar .q{font-size:24px;font-weight:900;flex:1}
  .gamebar .replay{border:none;background:var(--c-game);color:#fff;width:56px;height:56px;border-radius:14px;font-size:24px;cursor:pointer;flex:none}
  .findgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .findgrid.four{grid-template-columns:repeat(2,1fr)}
  .findcard{background:#fff;border-radius:22px;min-height:130px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:60px;cursor:pointer;transition:transform .1s,opacity .3s}
  .findcard:active{transform:scale(.96)}
  .findcard.right{outline:6px solid #33c88a}
  .findcard.wrong{opacity:.35;animation:wob .4s}
  @keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .crowd{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;background:#fff;border-radius:22px;padding:28px 14px;box-shadow:var(--shadow)}
  .citem{font-size:62px;cursor:pointer;position:relative;transition:transform .1s,opacity .3s}
  .citem:active{transform:scale(.9)}
  .citem.counted{opacity:.4;transform:scale(.88)}
  .citem.counted::after{content:attr(data-n);position:absolute;top:-12px;right:-12px;background:var(--c-game);color:#fff;font-size:20px;font-weight:900;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .chint{text-align:center;font-size:20px;font-weight:800;opacity:.6}
  .bubarea{position:relative;height:440px;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#d9f3ff,#f0fbff);box-shadow:var(--shadow);touch-action:none}
  .bubw{position:absolute;bottom:-100px;animation:rise linear forwards}
  @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-620px)}}
  .bub{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;cursor:pointer;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08)}
  .bub.pop{animation:pop .22s forwards}
  @keyframes pop{to{transform:scale(1.7);opacity:0}}
  .scalewrap{width:100%;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding-top:10px;overflow:hidden}
  .beamwrap{position:relative;height:216px}
  .beam{position:absolute;left:50%;top:78px;width:340px;height:14px;margin-left:-170px;background:#9fb4e8;border-radius:7px;transition:transform .5s ease;z-index:2}
  .beam::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;background:#7d92cc;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
  .pan{position:absolute;top:38px;width:136px;min-height:60px;background:#eef6ff;border:4px solid #9fb4e8;border-radius:12px 12px 18px 18px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;padding:4px 2px;font-size:26px;line-height:1;z-index:1}
  .pan::before{content:"";position:absolute;top:-24px;left:50%;margin-left:-2px;width:4px;height:24px;background:#9fb4e8}
  .pan.left{left:-58px}.pan.right{right:-58px}
  .pan .digit{font-size:44px;font-weight:900;color:var(--c-game)}
  .pole{position:absolute;left:50%;top:85px;margin-left:-9px;width:18px;height:88px;background:#c3cbe4;border-radius:6px;z-index:0}
  .base{position:absolute;left:50%;top:168px;margin-left:-48px;width:96px;height:16px;background:#c3cbe4;border-radius:8px}
  .tray{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:12px 0 4px}
  .trayit{font-size:46px;cursor:pointer;transition:transform .1s,opacity .3s;touch-action:none}
  .trayit:active{transform:scale(.85)}
  .dragghost{position:fixed;transform:translate(-50%,-50%);font-size:54px;pointer-events:none;z-index:999;opacity:0;transition:opacity .15s}
  .dragghost.on{opacity:.95}
  .pan.right.drop-ready{outline:5px solid #ffd166;background:#fff8e1}
  .balhint{text-align:center;font-size:20px;font-weight:800;opacity:.6;padding-bottom:14px}
  .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .scard{background:#fff;border-radius:22px;min-height:140px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
  .scard:active{transform:scale(.97)}
  .scard .emoji{font-size:56px}
  .scard .nm{font-size:24px;font-weight:900}

  /* 家长面板 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .mask.on{display:flex;}
  .panel{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:86vh;overflow:auto;}
  .panel h3{margin:0 0 6px;font-size:24px;}
  .panel .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #eee;font-size:18px;font-weight:700;}
  .panel select{font-size:16px;font-weight:700;padding:8px;border-radius:10px;border:2px solid #eee;background:#fff;max-width:180px;}
  .switch{width:56px;height:32px;border-radius:999px;background:#ddd;position:relative;cursor:pointer;transition:.2s;border:none;flex:none;}
  .switch.on{background:#33c88a;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on::after{left:27px;}
  input[type=range]{width:160px;}
  .gate{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .gate .opt{flex:1;min-width:60px;text-align:center;font-size:22px;font-weight:900;padding:14px;border-radius:14px;background:#f0f2ff;cursor:pointer;border:none;box-shadow:var(--shadow);}
  .hint2{font-size:14px;opacity:.6;font-weight:600;}
  .closebtn{margin-top:16px;width:100%;padding:14px;border:none;border-radius:14px;background:var(--ink);color:#fff;font-size:18px;font-weight:800;cursor:pointer;}
  .closebtn.blue{background:#37b6ff;margin-top:10px;}

  /* 顶部进度/标题 */
  .sectitle{font-size:22px;font-weight:900;margin:2px 0 12px;display:flex;align-items:center;gap:8px;}

  /* 星星 & 提示气泡 */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:9999;}
  .star{position:absolute;font-size:34px;animation:fly 1s ease-out forwards;}
  @keyframes fly{0%{opacity:0;transform:translateY(0) scale(.4) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-140px) scale(1.4) rotate(40deg)}}
  .toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:14px 26px;border-radius:999px;font-size:24px;font-weight:900;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.3);
    opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="fx" id="fx"></div>
<div class="toast" id="toast">真棒!</div>

<header>
  <button class="iconbtn backhome" id="btnHome" title="回首页">🏠</button>
  <div class="logo">🧸 宝宝乐园<small>拼音 · 数学 · 英语 · 认知 · 古诗</small></div>
  <button class="iconbtn" id="btnSound" title="音效开关">🔊</button>
  <button class="iconbtn" id="btnSettings" title="家长设置（长按）">⚙️</button>
</header>

<div class="wrap">
  <!-- 首页 -->
  <section id="screen-home">
    <div class="greet"><span class="face">👋</span>宝宝，点一点下面的大卡片，跟我一起读！</div>
    <div class="home-grid">
      <button class="big pinyin" data-go="pinyin"><span class="em">🀄</span>拼 音<span class="sub">声母 · 韵母 · 整体认读</span></button>
      <button class="big math" data-go="math"><span class="em">🔢</span>数 学<span class="sub">数字 · 比大小 · 加减 · 图形</span></button>
      <button class="big english" data-go="english"><span class="em">🔤</span>英 语<span class="sub">字母 · 单词 · 拼读</span></button>
      <button class="big word" data-go="word"><span class="em">🐶</span>认 知<span class="sub">动物 · 水果 · 身体 · 交通…</span></button>
      <button class="big game" data-go="game"><span class="em">🎮</span>游戏乐园<span class="sub">找一找 · 数一数 · 泡泡</span></button>
      <button class="big poem" data-go="poem"><span class="em">📖</span>古 诗<span class="sub">咏鹅 · 静夜思 · 春晓 · 悯农…</span></button>
    </div>
  </section>

  <!-- 科目区（动态渲染） -->
  <section id="screen-subject" class="hidden">
    <div class="sectitle" id="sectitle"></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- 家长面板 -->
<div class="mask" id="mask">
  <div class="panel" id="panel"></div>
</div>

<script>
"use strict";

/* ============ 设置状态（本地保存，iPad 上记住选择） ============ */
var state = {
  rate: 0.6,        // 语速（默认很慢，适合宝宝跟读）
  pitch: 1.15,      // 音调（稍高更亲切）
  soundOn: true,
  zhVoiceName: null, // 家长选定的中文声音
  enVoiceName: null, // 家长选定的英文声音
  sections: {pinyin:true, math:true, english:true, word:true, poem:true, game:true}
};
function saveState(){
  try{
    localStorage.setItem('babyParadiseV2', JSON.stringify({
      rate:state.rate, pitch:state.pitch, soundOn:state.soundOn,
      zhVoiceName:state.zhVoiceName, enVoiceName:state.enVoiceName, sections:state.sections
    }));
  }catch(e){}
}
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('babyParadiseV2')||'null');
    if(s){ for(var k in s){ if(s[k]!==undefined) state[k]=s[k]; } }
  }catch(e){}
})();

/* ============ 语音引擎（慢速 + 排队连读 + 可选声音） ============ */
var synth = window.speechSynthesis || null;
var zhVoice=null, enVoice=null;
var speakQueue=[], speaking=false, speakGen=0;

// 自动挑选更温柔的声线：优先常见的女声/童声，优先"增强/优质"音色
var ZH_PREFER = ['婷婷','tingting','ting-ting','晓晓','xiaoxiao','朵朵','云希','美佳','meijia','雅婷','yating'];
var EN_PREFER = ['samantha','victoria','ava','allison','karen','moira','tessa','zoe','susan','fiona'];
// 高质量人声识别（iOS 新版叫"优化音质/高音质"，旧版叫"增强/优质"）
var HQ_RE = /enhanced|premium|high\s*quality|optimi|增强|优质|高音质|优化|siri/i;
function pickVoice(list, savedName, langPrefix, prefer){
  var i, v;
  if(savedName){ for(i=0;i<list.length;i++){ if(list[i].name===savedName) return list[i]; } }
  var best=null, bestScore=-1;
  for(i=0;i<list.length;i++){
    v=list[i];
    if(v.lang.toLowerCase().indexOf(langPrefix)!==0) continue;
    var s=0, n=v.name.toLowerCase();
    for(var p=0;p<prefer.length;p++){ if(n.indexOf(prefer[p])>=0){ s=Math.max(s, prefer.length-p+2); break; } }
    if(HQ_RE.test(v.name)) s+=20;
    if(langPrefix==='zh' && /cn|cmn|mandarin|普通话|guoyu/i.test(v.lang+v.name)) s+=3;
    if(langPrefix==='en' && /us/i.test(v.lang)) s+=2;
    if(/female|女/i.test(v.name)) s+=1;
    if(s>bestScore){ bestScore=s; best=v; }
  }
  return best;
}
function loadVoices(){
  if(!synth) return;
  var vs = synth.getVoices();
  zhVoice = pickVoice(vs, state.zhVoiceName, 'zh', ZH_PREFER);
  enVoice = pickVoice(vs, state.enVoiceName, 'en', EN_PREFER);
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }

function pump(){
  if(speaking) return;
  var it = speakQueue.shift();
  if(!it) return;
  var myGen = speakGen;
  var u = new SpeechSynthesisUtterance(it.t);
  if(it.l==='en'){ u.lang=(enVoice&&enVoice.lang)||'en-US'; if(enVoice) u.voice=enVoice; }
  else { u.lang=(zhVoice&&zhVoice.lang)||'zh-CN'; if(zhVoice) u.voice=zhVoice; }
  u.rate = state.rate; u.pitch = state.pitch; u.volume = 1;
  speaking = true;
  u.onend = function(){ if(myGen!==speakGen) return; speaking=false; if(speakQueue.length) setTimeout(pump, 350); };
  u.onerror = function(){ if(myGen!==speakGen) return; speaking=false; if(speakQueue.length) setTimeout(pump, 100); };
  try{ synth.speak(u); }catch(e){ speaking=false; }
}
/* ---- 真人语音包（WebAudio 播放，离线可用；没有的文案自动退回系统语音） ---- */
var AU={idx:null, buf:null, src:null};
function auInit(){
  if(AU.idx) return;
  fetch('./voice.json').then(function(r){ return r.json(); }).then(function(j){
    AU.idx=j;
    return fetch('./voice.mp3');
  }).then(function(r){ return r.arrayBuffer(); }).then(function(ab){
    var c=ac();
    if(!c) return;
    c.decodeAudioData(ab, function(buf){ AU.buf=buf; }, function(){});
  }).catch(function(){});
}
function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
function stopVoice(){
  try{ if(AU.src) AU.src.stop(); }catch(e){}
  AU.src=null;
}
function playSeg(key, myGen){
  return new Promise(function(res){
    var it=AU.idx.clips[key];
    if(!it || !AU.buf){ res(); return; }
    var c=ac();
    if(!c){ res(); return; }
    var src=c.createBufferSource();
    src.buffer=AU.buf;
    var pb=Math.min(1.3, Math.max(0.7, state.rate/0.6));
    src.playbackRate.value=pb;
    src.connect(c.destination);
    AU.src=src;
    var done=false;
    function finish(){ if(done) return; done=true; try{ src.stop(); }catch(e){} if(AU.src===src) AU.src=null; res(); }
    src.onended=function(){ if(!done){ done=true; if(AU.src===src) AU.src=null; res(); } };
    try{ src.start(0, it.s, it.d); }catch(e){ finish(); return; }
    setTimeout(finish, (it.d/pb + 1.5)*1000);
  });
}
function playKeys(keys, myGen){
  stopVoice();
  (async function(){
    for(var i=0;i<keys.length;i++){
      if(myGen!==speakGen) return;
      await playSeg(keys[i], myGen);
      if(myGen!==speakGen) return;
      await wait(160);
    }
  })();
}
function keysFor(arr){
  if(!AU.idx || !AU.buf) return null;
  var keys=[];
  for(var i=0;i<arr.length;i++){
    var k=AU.idx.t2k[arr[i].t+'|'+(arr[i].l||'zh')];
    if(!k) return null;
    keys.push(k);
  }
  return keys;
}
// 立即打断并说一段（优先真人语音包，缺文案时退回系统语音）
function speak(text, lang){
  speakSeq([{t:text, l:lang||'zh'}]);
}
// 依次连读多段（段与段之间留小停顿，宝宝跟得上）
function speakSeq(arr){
  if(!arr || !arr.length) return;
  var myGen=++speakGen;
  speakQueue=[]; speaking=false;
  try{ synth.cancel(); }catch(e){}
  auInit();
  var keys=keysFor(arr);
  if(keys){ playKeys(keys, myGen); return; }
  if(!synth) return;
  speakQueue=arr.slice(); speaking=false;
  setTimeout(pump, 60);
}

/* ============ 音效 (Web Audio) ============ */
var actx=null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq, start, dur, type, vol){
  var a=ac(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination);
  var t=a.currentTime+start;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||0.18,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function ding(){
  if(!state.soundOn) return;
  tone(660,0,.18,'triangle'); tone(880,.08,.22,'triangle'); tone(1175,.18,.28,'sine');
}
function pop(){
  if(!state.soundOn) return;
  tone(520,0,.08,'square',.12);
}

/* 通用卡片 */
function mkCard(cls){ var d=document.createElement('div'); d.className='card '+(cls||''); var ico=document.createElement('span'); ico.className='speak-ico'; ico.textContent='🔈'; d.appendChild(ico); return d; }

/* ============ 拼音 ============ */
function buildPinyin(kind, grid){
  var arr = kind==='sheng'?SHENGMU:YUNMU;
  arr.forEach(function(it){
    var letter=it[0], read=it[1], example=it[2];
    var c=mkCard('plain');
    c.innerHTML+='<div class="big-txt">'+letter+'</div>'+
                 '<div class="say">'+read+'</div>'+
                 '<div class="hint">'+example+'</div>';
    c.onclick=function(){
      ding();
      // 先读呼读音，再带例字，如“玻，爸爸”
      speak(read+'，'+example, 'zh');
    };
    grid.appendChild(c);
  });
}
function buildZhengti(grid){
  ZHENGTI.forEach(function(it){
    var syll=it[0], read=it[1], example=it[2];
    var c=mkCard('plain');
    c.innerHTML+='<div class="big-txt">'+syll+'</div>'+
                 '<div class="say">'+read+'</div>'+
                 '<div class="hint">'+example+'</div>';
    c.onclick=function(){ ding(); speak(read+'，'+example, 'zh'); };
    grid.appendChild(c);
  });
}
function buildTone(grid){
  TONES.forEach(function(it){
    var syll=it[0], read=it[1], example=it[2];
    var c=mkCard('plain');
    var fs = syll.length>6 ? '24px' : '46px';
    c.innerHTML+='<div class="big-txt" style="font-size:'+fs+'">'+syll+'</div>'+
                 '<div class="say">'+read+'</div>'+
                 '<div class="hint">'+example+'</div>';
    // 四声在短语上下文里才读得准：整组连读（妈，麻，马，骂）
    c.onclick=function(){ ding(); speak(read.split('').join('，'), 'zh'); };
    grid.appendChild(c);
  });
}

function dotsRow(n){
  var box='<div class="dots">';
  for(var i=0;i<n;i++) box+='<span class="dot"></span>';
  return box+'</div>';
}
function buildNum(grid){
  for(var n=0;n<=20;n++){
    (function(n){
      var c=mkCard('bignum');
      var dots = n<=10 ? dotsRow(n) : '';
      c.innerHTML+='<div class="big-txt">'+n+'</div>'+dots+'<div class="hint">'+NUM[n]+'</div>';
      if(n>10) c.innerHTML+='<div class="hint">数一数：1 到 '+n+'</div>';

  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }

}

function buildBalance(grid){
  function round(){
    grid.innerHTML = '';
    var n = 1 + rand(5);
    var it = BAL_ITEMS[rand(BAL_ITEMS.length)];
    var placed = 0, done = false;
    function tilt(){ return -((n - placed) / n) * 16; }
    var wrap = document.createElement('div'); wrap.className = 'scalewrap';
    var bw = document.createElement('div'); bw.className = 'beamwrap';
    var beam = document.createElement('div'); beam.className = 'beam';
    var lp = document.createElement('div'); lp.className = 'pan left';
    lp.innerHTML = '<div class="digit">' + n + '</div>';
    var rp = document.createElement('div'); rp.className = 'pan right';
    beam.appendChild(lp); beam.appendChild(rp);
    beam.style.transform = 'rotate(' + tilt() + 'deg)';
    bw.appendChild(beam);
    var pole = document.createElement('div'); pole.className = 'pole';
    var base = document.createElement('div'); base.className = 'base';
    bw.appendChild(pole); bw.appendChild(base);
    wrap.appendChild(bw);
    var tray = document.createElement('div'); tray.className = 'tray';
    var tip = function(t){
      t.className = 'trayit';
      t.textContent = it[0];
      t.style.touchAction = 'none';
      function place(){
        if (done || t.__used) return;
        t.__used = true;
        t.style.opacity = .22;
        placed++;
        var s = document.createElement('span'); s.textContent = it[0];
        rp.appendChild(s);
        speak(NUM[placed], 'zh');
        beam.style.transform = 'rotate(' + tilt() + 'deg)';
        if (placed === n) {
          done = true;
          setTimeout(function(){
            if (!(curSub === 'game' && curTab === 2)) return;
            praise('正好!');
            speakSeq([{t:NUM[n],l:'zh'},{t:'个',l:'zh'}]);
            setTimeout(function(){ if (curSub === 'game' && curTab === 2) round(); }, 2600);
          }, 650);
        }
      }
      function overPan(x, y){
        var r = rp.getBoundingClientRect();
        return x > r.x - 50 && x < r.right + 50 && y > r.y - 70 && y < r.bottom + 40;
      }
      t.addEventListener('pointerdown', function(e){
        if (done || t.__used) return;
        var sx = e.clientX, sy = e.clientY, moved = false;
        var ghost = document.createElement('div'); ghost.className = 'dragghost';
        ghost.textContent = it[0];
        ghost.style.left = sx + 'px'; ghost.style.top = sy + 'px';
        document.body.appendChild(ghost);
        var pid = e.pointerId;
        try { t.setPointerCapture(pid); } catch(err){}
        function move(ev){
          if (ev.pointerId !== pid) return;
          if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 12) {
            moved = true;
            t.style.opacity = .25;
            ghost.classList.add('on');
          }
          if (moved) {
            ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
            rp.classList.toggle('drop-ready', overPan(ev.clientX, ev.clientY));
          }
        }
        function finish(ev){
          if (ev.pointerId !== pid) return;
          t.removeEventListener('pointermove', move);
          t.removeEventListener('pointerup', finish);
          t.removeEventListener('pointercancel', cancel);
          rp.classList.remove('drop-ready');
          if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
          if (!moved || overPan(ev.clientX, ev.clientY)) place();
          else t.style.opacity = '';
        }
        function cancel(){
          t.removeEventListener('pointermove', move);
          t.removeEventListener('pointerup', finish);
          t.removeEventListener('pointercancel', cancel);
          rp.classList.remove('drop-ready');
          if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
          t.style.opacity = '';
        }
        t.addEventListener('pointermove', move);
        t.addEventListener('pointerup', finish);
        t.addEventListener('pointercancel', cancel);
      });
      tray.appendChild(t);
    };
    for (var i = 0; i < n + 3; i++) tip(document.createElement('div'));
    wrap.appendChild(tray);
    var hint = document.createElement('div'); hint.className = 'balhint';
    hint.textContent = '👆 把' + it[1] + '拖上天平（点一点也行）';
    wrap.appendChild(hint);
    grid.appendChild(wrap);
    ding();
    speak('放' + NUM[n] + '个', 'zh');
  }
  round();
}

  pr.appendChild(ps); panel.appendChild(pr);

  // 声音选择（试听后挑选，iPad 会记住）
  // 排序：增强/优质人声排最前，大陆/美国口音优先，紧凑音色靠后
  function vQuality(v){ return HQ_RE.test(v.name) ? 20 : (/compact|紧凑/i.test(v.name) ? -2 : 0); }
  function vRegion(v, pre){ var l=v.lang.toLowerCase(); return (l.indexOf(pre)===0 && (l.indexOf('cn')>=0 || l.indexOf('us')>=0)) ? 4 : 0; }
  function nicer(list, pre){
    return list.slice().sort(function(a,b){ return (vQuality(b)+vRegion(b,pre)) - (vQuality(a)+vRegion(a,pre)); });
  }
  var vs = synth? synth.getVoices():[];
  var zhList=nicer(vs.filter(function(v){ return v.lang.toLowerCase().indexOf('zh')===0; }), 'zh');
  var enList=nicer(vs.filter(function(v){ return v.lang.toLowerCase().indexOf('en')===0; }), 'en');
  voiceRow('🇨🇳 中文声音', zhList, 'zhVoiceName', '宝宝你好呀，我们一起读书吧！', 'zh');
  voiceRow('🇺🇸 英文声音', enList, 'enVoiceName', 'Hello! Great job!', 'en');

  // 声音检测：显示本机实际暴露给网页的声音数量，方便排查
  var cnt=document.createElement('div'); cnt.className='hint2'; cnt.style.marginTop='8px';
  cnt.textContent='声音检测：本机网页可用声音共 '+vs.length+' 个，其中中文 '+zhList.length+' 个、英文 '+enList.length+' 个。在系统里新下载声音后，需彻底关闭本页再重开才会出现；iOS 最新的“高音质”级声音不开放给网页，请下载“优化音质”级（如婷婷·优化音质）。';
  panel.appendChild(cnt);

  var vTip=document.createElement('div'); vTip.className='hint2'; vTip.style.marginTop='8px';
  vTip.textContent='小贴士：声音的多少由 iPad 决定。去「设置 → 辅助功能 → 朗读内容 → 声音 → 中文（中国）」可以免费下载更多人声——凡是标着“增强 / 优质”的都值得下载（如婷婷·增强），温柔自然得多。下载后回到这里，列表会自动变多，带 ★ 的就是高质量声音，选中后点 🔊 试听。';
  panel.appendChild(vTip);

  // iPad 防误触指南
  var gb=document.createElement('button'); gb.className='closebtn blue'; gb.textContent='📱 iPad 防乱点指南（引导式访问）';
  var gd=document.createElement('div'); gd.className='hint2'; gd.style.display='none';
  gd.style.whiteSpace='pre-line'; gd.style.lineHeight='1.8'; gd.style.marginTop='8px';
  gd.textContent=
    '① 「设置 → 辅助功能 → 引导式访问」打开，设置家长密码，并打开「辅助功能快捷键」\n'+
    '② 用 Safari 打开宝宝乐园（建议先「分享 → 添加到主屏幕」，以后从图标打开就是全屏）\n'+
    '③ 进入页面后连按三下顶部电源键（有 Home 键的 iPad 连按三下 Home 键），点「开始」\n'+
    '④ 开启后 Home 键、上滑手势、通知全部失效，宝宝只能玩这一个页面\n'+
    '⑤ 想退出：再连按三下电源键 → 输入密码 → 「结束」\n'+
    '⑥ 首次联网打开成功后，本页会自动离线缓存，以后断网也能玩；以后更新内容重新上传，联网时打开一次就更新\n'+
    '还可以在引导式访问里圈掉屏幕角落、关闭触摸区域、设置时间限制哦';
  gb.onclick=function(){ gd.style.display = gd.style.display==='none'?'block':'none'; };
  panel.appendChild(gb); panel.appendChild(gd);

  var t=document.createElement('div'); t.className='hint2'; t.style.marginTop='10px';
  t.textContent='小提示：2岁左右的宝宝注意力很短，每次陪玩 5–10 分钟即可，重在“点一下就发音”的即时反馈，不要求记住。建议家长在旁边一起读。';
  panel.appendChild(t);

  var close=document.createElement('button'); close.className='closebtn'; close.textContent='完成';
  close.onclick=function(){ mask.classList.remove('on'); };
  panel.appendChild(close);
}
function applySections(){
  document.querySelectorAll('.big').forEach(function(b){
    var k=b.getAttribute('data-go');
    b.classList.toggle('off', !state.sections[k]);
  });
}

/* ⚙️ 改为长按 0.8 秒打开，宝宝乱点进不去 */
var gearEl=document.getElementById('btnSettings'), gearTimer=null;
gearEl.addEventListener('pointerdown', function(){
  gearTimer=setTimeout(function(){ gearTimer=null; openSettings(); }, 800);
});
['pointerup','pointerleave','pointercancel'].forEach(function(ev){
  gearEl.addEventListener(ev, function(){
    if(gearTimer){ clearTimeout(gearTimer); gearTimer=null; toast('长按 ⚙️ 打开家长设置'); }
  });
});
gearEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

mask.onclick=function(e){ if(e.target===mask) mask.classList.remove('on'); };

/* ============ 防误触：禁捏合缩放 / 禁双击放大 / 长按不弹菜单 ============ */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ============ 首次交互解锁音频 + 保持屏幕常亮（支持时） ============ */
var wakeLock=null;
function reqWake(){
  if(navigator.wakeLock && navigator.wakeLock.request){
    navigator.wakeLock.request('screen').then(function(s){ wakeLock=s; }).catch(function(){});
  }
}
document.addEventListener('pointerdown', function once(){
  ac(); loadVoices(); reqWake();
  document.removeEventListener('pointerdown', once);
});
document.addEventListener('pointerdown', function(){
  var c=ac();
  if(c && c.state==='suspended'){ try{ c.resume(); }catch(e){} }
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible'){
    loadVoices(); reqWake();
    if(actx && actx.state==='suspended'){ try{ actx.resume(); }catch(e){} }
  }
});

applySections();

/* 离线缓存：需 https 或 localhost；file:// 打开时自动跳过，不影响本地使用 */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    var ok = location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
    if(ok) navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
window.addEventListener('load', auInit);
window.BB={state:state, speak:speak, speakSeq:speakSeq, AU:AU};
</script>
